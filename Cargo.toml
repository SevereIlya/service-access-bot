[package]
name = "telegram-bot"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base62 = "2.2.4"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.25"
reqwest = { version = "0.13.4", features = ["json", "cookies"]}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
teloxide = { version = "0.17.0", features = ["macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4", "v5", "serde"] }

[dependencies.sqlx]
version = "0.9.0"
features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid"
]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
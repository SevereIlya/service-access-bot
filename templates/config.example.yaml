mode: rule
mixed-port: 7897
allow-lan: false
ipv6: false

tun:
  enable: true
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  nameserver:
    - https://dns.google/dns-query

proxies: []

proxy-groups:
  - name: "Proxy"
    type: select
    proxies: []

rules:
  - MATCH,DIRECT
